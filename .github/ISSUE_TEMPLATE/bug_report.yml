name: 🐛 Bug Report
description: Report an issue or unexpected behavior in the TileMetrics for Beszel plugin.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues first to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Affected Action or Component
      description: Which part of TileMetrics is having issues?
      options:
        - CPU Telemetry Action
        - Memory Telemetry Action
        - Storage Telemetry Action
        - Network Telemetry Action
        - GPU Telemetry Action
        - UPS / Battery Action
        - Property Inspector (Settings UI)
        - Beszel Connection & Authentication
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Versions
      description: Please specify your setup details.
      placeholder: "e.g., Windows 11 / macOS Sonoma, Stream Deck App v6.5+, Plugin v0.1.0.0, Beszel Hub v0.9+"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Stream Deck Hardware Model
      options:
        - Stream Deck MK.2 / Classic (15 keys)
        - Stream Deck XL (32 keys)
        - Stream Deck Mini (6 keys)
        - Stream Deck + (Keypad)
        - Stream Deck Neo (8 keys)
        - Stream Deck Mobile (iOS / Android)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Configure Beszel server URL in Property Inspector
        2. Assign CPU action to key
        3. Observe key behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stream Deck Plugin Logs
      description: |
        Paste relevant log entries from:
        - Windows: `%APPDATA%\Elgato\StreamDeck\logs\com.smok3y97.tilemetrics.beszel\`
        - macOS: `~/Library/Application Support/com.elgato.StreamDeck/logs/com.smok3y97.tilemetrics.beszel/`
      render: shell
