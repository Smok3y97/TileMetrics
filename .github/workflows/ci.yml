name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      # Workflow definitions
      - ".github/workflows/ci.yml"
      # Static vector and raster assets
      - "assets/**"
      # Build and automation scripts
      - "scripts/**"
      # TypeScript source code
      - "src/**"
      # Property Inspector frontend components
      - "ui/**"
      # Localization dictionaries
      - "de.json"
      - "en.json"
      # Plugin manifest & version source
      - "manifest.json"
      - "version.json"
      # Build and linter configurations
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.mjs"
      - "tsconfig.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      # Workflow definitions
      - ".github/workflows/ci.yml"
      # Static vector and raster assets
      - "assets/**"
      # Build and automation scripts
      - "scripts/**"
      # TypeScript source code
      - "src/**"
      # Property Inspector frontend components
      - "ui/**"
      # Localization dictionaries
      - "de.json"
      - "en.json"
      # Plugin manifest & version source
      - "manifest.json"
      - "version.json"
      # Build and linter configurations
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.mjs"
      - "tsconfig.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Lint, Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting check
        run: npm run lint

      - name: Compile TypeScript and bundle
        run: npm run build

      - name: Stage plugin bundle for validation
        run: |
          mkdir -p release/com.smok3y97.tilemetrics.beszel.sdPlugin
          cp manifest.json release/com.smok3y97.tilemetrics.beszel.sdPlugin/
          [ -f en.json ] && cp en.json release/com.smok3y97.tilemetrics.beszel.sdPlugin/ || true
          [ -f de.json ] && cp de.json release/com.smok3y97.tilemetrics.beszel.sdPlugin/ || true
          cp -r bin release/com.smok3y97.tilemetrics.beszel.sdPlugin/
          cp -r ui release/com.smok3y97.tilemetrics.beszel.sdPlugin/
          cp -r assets release/com.smok3y97.tilemetrics.beszel.sdPlugin/

      - name: Validate Stream Deck plugin
        run: npx streamdeck validate --no-update-check release/com.smok3y97.tilemetrics.beszel.sdPlugin

      - name: Pack .streamDeckPlugin artifact
        run: npx streamdeck pack release/com.smok3y97.tilemetrics.beszel.sdPlugin --output release/ --force

      - name: Upload Stream Deck Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.smok3y97.tilemetrics.beszel.streamDeckPlugin
          path: release/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
